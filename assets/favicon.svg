<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Arrière-plan sombre transparent pour s'assurer du bon contraste sur l'onglet du navigateur -->
  <rect width="100" height="100" rx="20" fill="#050508" opacity="0.9" />

  <!-- Triangle inversé de base (hommage au logo d'origine) -->
  <polygon points="18,30 82,30 50,85" fill="none" stroke="#ff5100" stroke-width="5" stroke-linejoin="round" />

  <!-- Cornes Dwennimmen (Symbole Adinkra - Force et Humilité) stylisées en cyberpunk à la base du triangle -->
  <path d="M 38 30 C 32 12, 10 15, 18 35" fill="none" stroke="#ff5100" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 62 30 C 68 12, 90 15, 82 35" fill="none" stroke="#ff5100" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Éléments du masque cyberpunk géométrique (Menthe Cybernétique) -->
  <!-- Arête centrale du masque -->
  <line x1="50" y1="35" x2="50" y2="68" stroke="#00ffd0" stroke-width="5" stroke-linecap="round" />
  
  <!-- Chevrons / Yeux cybernétiques symétriques -->
  <polyline points="30,42 42,50 42,60" fill="none" stroke="#00ffd0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
  <polyline points="70,42 58,50 58,60" fill="none" stroke="#00ffd0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Menton / Chevron inférieur -->
  <polyline points="40,68 50,78 60,68" fill="none" stroke="#ff5100" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
</svg>
